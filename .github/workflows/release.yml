name: Release

on:
  push:
    tags:
      - "v*"
  # Manual/Auto Release dispatch: GITHUB_TOKEN pushes cannot retrigger
  # push-based workflows, so auto-release.yml hands the computed tag over
  # through this input instead of relying on the tag push itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z); must already point at the target commit"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run tests
        run: go test -v ./...

  build-and-release:
    name: Build & Publish Release
    needs: verify
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Build release binaries
        run: |
          mkdir -p dist
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT=$(git rev-parse HEAD)
          LDFLAGS="-s -w -X main.Version=${RELEASE_TAG} -X main.Commit=${COMMIT} -X main.Date=${BUILD_DATE}"

          # Target platforms: linux/amd64, darwin/arm64, windows/amd64
          targets=(
            "linux/amd64/izyan-linux-amd64"
            "darwin/arm64/izyan-darwin-arm64"
            "windows/amd64/izyan-windows-amd64.exe"
          )

          for target in "${targets[@]}"; do
            IFS='/' read -r goos goarch binary <<< "$target"
            echo "==> Building ${binary} for ${goos}/${goarch}..."
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="${LDFLAGS}" \
              -o "dist/${binary}" \
              ./cmd/izyan
          done

      - name: Package archives and checksums
        run: |
          cd dist
          tar -czvf "izyan-${RELEASE_TAG}-linux-amd64.tar.gz" izyan-linux-amd64
          tar -czvf "izyan-${RELEASE_TAG}-darwin-arm64.tar.gz" izyan-darwin-arm64
          zip -j "izyan-${RELEASE_TAG}-windows-amd64.zip" izyan-windows-amd64.exe

          sha256sum izyan-* > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: izyan-${{ env.RELEASE_TAG }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --title "${RELEASE_TAG}" \
            --generate-notes
